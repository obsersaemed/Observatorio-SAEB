<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de SAEB en Colombia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }

  #map { width: 100%; height: 100%; background: #dfe4ea; }

  .app-title {
    position: absolute;
    top: 12px; left: 50px;
    z-index: 1000;
    background: rgba(255,255,255,0.95);
    padding: 10px 18px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-size: 16px;
    font-weight: 600;
    color: #1a3c5e;
    max-width: calc(100% - 120px);
  }
  .app-title span {
    display: block;
    font-weight: 400;
    font-size: 12px;
    color: #556;
    margin-top: 2px;
  }

  .legend-box {
    position: absolute;
    bottom: 24px; right: 12px;
    z-index: 1000;
    background: rgba(255,255,255,0.95);
    padding: 12px 16px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-size: 13px;
    max-width: 220px;
  }
  .legend-box h4 { margin: 0 0 8px 0; font-size: 13px; color: #1a3c5e; }
  .legend-row { display: flex; align-items: center; margin-bottom: 6px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.2); }
  .legend-src { margin-top: 8px; font-size: 11px; color: #778; }

  .popup-title { font-size: 16px; font-weight: 700; color: #1a3c5e; margin-bottom: 6px; }
  .popup-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  .popup-list li strong { color: #333; }
  .popup-list a { color: #1a3c5e; }

  .marker-cluster-custom {
    background-clip: padding-box;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
  }

  @media (max-width: 600px) {
    .app-title { font-size: 14px; padding: 8px 12px; }
    .legend-box { bottom: 30px; }
  }
</style>
</head>
<body>

<div class="app-title">
  Inventario de SAEB en Colombia
</div>

<div id="map"></div>

<div class="legend-box">
  <h4>Estado</h4>
  <div class="legend-row"><span class="legend-dot" style="background:#2e8b57"></span> En operación</div>
  <div class="legend-row"><span class="legend-dot" style="background:#e8a33d"></span> En construcción</div>
  <div class="legend-row"><span class="legend-dot" style="background:#b0b0b0"></span> Anunciado</div>
  <div class="legend-row"><span class="legend-dot" style="background:#d9363e"></span> Inactivo</div>
  <div class="legend-src">Fuente: Base de datos SAEB</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>

// ============================================================
// DATOS — se leen de proyectos.csv (misma estructura que "Base de datos SAEB", Hoja 1).
// Para actualizar el mapa: descargar la hoja como CSV, reemplazar proyectos.csv y subir a GitHub.
// ============================================================
const DATOS_CSV = 'proyectos.csv';

// ============================================================
// MAPA BASE
// ============================================================
const map = L.map('map', { zoomControl: true }).setView([4.6, -74.3], 6);

// OSM exige que la página envíe su origen (Referer); por eso el mapa debe
// abrirse desde un servidor (GitHub Pages o localhost), no con doble clic (file://).
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
  referrerPolicy: 'strict-origin-when-cross-origin'
}).addTo(map);

if (location.protocol === 'file:') {
  const aviso = document.createElement('div');
  aviso.style.cssText = 'position:absolute;top:70px;left:50px;z-index:1000;background:#fff3cd;color:#664d03;' +
    'padding:8px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:13px;max-width:420px';
  aviso.textContent = 'OpenStreetMap no carga el mapa base cuando el archivo se abre con doble clic. ' +
    'Ábrelo desde GitHub Pages o un servidor local.';
  document.body.appendChild(aviso);
}

// ============================================================
// COLOR SEGÚN ESTADO
// ============================================================
function colorPorEstado(estado) {
  const e = (estado || "").toLowerCase();
  if (e.includes("operaci")) return "#2e8b57";
  if (e.includes("construcci")) return "#e8a33d";
  if (e.includes("inactiv")) return "#d9363e";
  return "#b0b0b0";
}

// ============================================================
// CLUSTER DE MARCADORES
// ============================================================
const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 50,
  iconCreateFunction: function (cluster) {
    const count = cluster.getChildCount();
    return L.divIcon({
      html: `<div class="marker-cluster-custom" style="background:#1a3c5e; width:${34 + Math.min(count,20)}px; height:${34 + Math.min(count,20)}px; border:2px solid #fff;">${count}</div>`,
      className: '',
      iconSize: L.point(40, 40)
    });
  }
});

const fmt = v => (v === "" || v == null || isNaN(v)) ? v : Number(v).toLocaleString("es-CO", { maximumFractionDigits: 2 });
const li = (label, v) => (v === "" || v == null) ? "" : `<li><strong>${label}:</strong> ${v}</li>`;

// La etiqueta se abre al pasar el mouse y se cierra al salir; si el mouse
// entra a la etiqueta (p. ej. para abrir un enlace de Fuente) se mantiene abierta.
let cierre = null;
function abrirAlPasar(marker) {
  const cancelar = () => { clearTimeout(cierre); cierre = null; };
  const programar = () => { cancelar(); cierre = setTimeout(() => marker.closePopup(), 300); };
  marker.on("mouseover", () => { cancelar(); marker.openPopup(); });
  marker.on("mouseout", programar);
  marker.on("popupopen", e => {
    const el = e.popup.getElement();
    el.onmouseenter = cancelar;
    el.onmouseleave = programar;
  });
}

function pintar(lista) {
  clusterGroup.clearLayers();
  lista.forEach(p => {
    if (p.lat === "" || p.lon === "" || isNaN(p.lat) || isNaN(p.lon)) return;
    const marker = L.circleMarker([p.lat, p.lon], {
      radius: 9,
      fillColor: colorPorEstado(p.estado),
      color: "#fff",
      weight: 2,
      fillOpacity: 0.9
    });

    const fuentes = (p.fuentes || []).map(u =>
      `<a href="${u}" target="_blank" rel="noopener">${new URL(u).hostname.replace(/^www\./, "")}</a>`).join(", ");

    const popupHtml = `
      <div class="popup-title">${p.nombre}</div>
      <ul class="popup-list">
        ${li("Operador", p.operador)}
        ${li("Estado", p.estado)}
        ${li("Tecnología", p.tecnologia)}
        ${li("Fecha de puesta en operación", p.fecha)}
        ${li("Tipo de uso/conexión", p.tipoUso)}
        ${li("Punto de conexión", p.puntoConexion)}
        ${li("Departamento", p.departamento)}
        ${li("Municipio", p.municipio)}
        ${li("Capacidad nominal (MW)", fmt(p.capacidadNominalMW))}
        ${li("Capacidad máxima (MWh)", fmt(p.capacidadMaximaMWh))}
        ${li("Potencia máxima de descarga (MW)", p.descargaMax)}
        ${li("Potencia máxima de carga (MW)", p.cargaMax)}
        ${li("Estado de carga mínimo técnico (%)", p.socMin)}
        ${li("Eficiencia mínima (%)", p.efMin)}
        ${li("Eficiencia de carga (%)", p.efCarga)}
        ${li("Eficiencia de descarga (%)", p.efDescarga)}
        ${li("Eficiencia de almacenamiento (%)", p.efAlm)}
        ${li("Tiempo para aporte de máxima potencia", p.tMax)}
        ${li("Tipo de compensación adicional", p.compensacion)}
        ${li("Fuente", fuentes)}
      </ul>
    `;

    marker.bindPopup(popupHtml, { maxWidth: 320 });
    abrirAlPasar(marker);
    clusterGroup.addLayer(marker);
  });
}

map.addLayer(clusterGroup);

// ============================================================
// LECTURA DE proyectos.csv
// ============================================================
function parseCSV(txt) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"' && txt[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && txt[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const t = s => String(s ?? "").trim();
// Acepta "4,9653" (coma decimal de Sheets en español) y "4.9653"
const num = s => {
  let v = t(s);
  if (v === "") return "";
  if (v.includes(",") && v.includes(".")) v = v.replace(/\./g, "");
  return Number(v.replace(",", "."));
};

function mostrarError(msg) {
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;top:70px;left:50px;z-index:1000;background:#f8d7da;color:#842029;' +
    'padding:8px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:13px;max-width:420px';
  box.textContent = msg;
  document.body.appendChild(box);
}

async function cargar() {
  try {
    const resp = await fetch(DATOS_CSV, { cache: 'no-cache' });
    if (!resp.ok) throw new Error(resp.status);
    const rows = parseCSV(await resp.text()).filter(r => t(r[0]));
    const datos = rows.slice(1).map(r => ({
      nombre: t(r[0]), operador: t(r[1]), estado: t(r[2]), tecnologia: t(r[3]), fecha: t(r[4]),
      tipoUso: t(r[5]), puntoConexion: t(r[6]) ? t(r[6]) + " kV" : "", departamento: t(r[7]), municipio: t(r[8]),
      lat: num(r[9]), lon: num(r[10]), capacidadNominalMW: num(r[11]), capacidadMaximaMWh: num(r[12]),
      descargaMax: t(r[13]), cargaMax: t(r[14]), socMin: t(r[15]), efMin: t(r[16]), efCarga: t(r[17]),
      efDescarga: t(r[18]), efAlm: t(r[19]), tMax: t(r[20]), compensacion: t(r[21]),
      fuentes: t(r[22]).split(/\s+/).filter(u => /^https?:\/\//.test(u))
    }));
    pintar(datos);
    const sinCoord = datos.filter(p => isNaN(p.lat) || isNaN(p.lon) || p.lat === "" || p.lon === "");
    if (sinCoord.length) console.warn("Proyectos sin coordenadas válidas:", sinCoord.map(p => p.nombre));
  } catch (e) {
    console.error(e);
    mostrarError('No se pudo leer proyectos.csv. Verifica que el archivo esté junto a index.html.');
  }
}
cargar();
</script>

</body>
</html>
